name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

# Reads the repository and nothing else: no secret, no write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned by commit, so that a compromised tag cannot run here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm, at the version pinned in package.json
        id: pnpm
        run: |
          npm install --global "$(node --print "require('./package.json').packageManager")"
          echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Audit development tools (reported, not blocking)
        run: pnpm audit
        continue-on-error: true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # The worker's backup tests run pg_dump and pg_restore against PostgreSQL 18.
      - name: Install the PostgreSQL 18 client tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes --no-install-recommends postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      # The interface components are tested in Chromium, at the version Playwright pins.
      - name: Install Chromium for the component tests
        run: pnpm --filter @mailbox/ui exec playwright install --with-deps --only-shell chromium
      - run: pnpm test

  # Each architecture builds on a native runner. A pull request only builds, which catches a broken
  # image before it reaches main; main and version tags also publish.
  images:
    name: images (${{ matrix.arch }})
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      # Each architecture reports its own result; publishing still needs both.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    outputs:
      prefix: ${{ steps.names.outputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Name the images after the repository owner, in lowercase as the registry requires
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "prefix=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the api image
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          platforms: linux/${{ matrix.arch }}
          # The source label links the published package to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.names.outputs.prefix }}/mailbox-api,push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,scope=api-${{ matrix.arch }},mode=max
      - name: Build the worker image
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.names.outputs.prefix }}/mailbox-worker,push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          cache-from: type=gha,scope=worker-${{ matrix.arch }}
          cache-to: type=gha,scope=worker-${{ matrix.arch }},mode=max
      - name: Record the published digests
        if: env.PUBLISH == 'true'
        env:
          ARCH: ${{ matrix.arch }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          mkdir digests
          echo "$API_DIGEST" > "digests/api-$ARCH"
          echo "$WORKER_DIGEST" > "digests/worker-$ARCH"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests
          retention-days: 1

  # Gathers both architectures under each tag: main (what an installation following main pulls),
  # sha-<commit> (to go back to any version) and, for a version tag, the version and latest.
  manifests:
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api-tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.images.outputs.prefix }}/mailbox-api
          flavor: latest=false
          tags: &tags |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: worker-tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.images.outputs.prefix }}/mailbox-worker
          flavor: latest=false
          tags: *tags
      - name: Publish each tag for both architectures
        env:
          PREFIX: ${{ needs.images.outputs.prefix }}
          API_TAGS: ${{ steps.api-tags.outputs.tags }}
          WORKER_TAGS: ${{ steps.worker-tags.outputs.tags }}
        run: |
          publish() {
            local image="$1" tags="$2" component="$3"
            local tag_arguments=() sources=()
            for tag in $tags; do tag_arguments+=(--tag "$tag"); done
            for digest_file in digests/"$component"-*; do sources+=("$image@$(cat "$digest_file")"); done
            docker buildx imagetools create "${tag_arguments[@]}" "${sources[@]}"
          }
          publish "$PREFIX/mailbox-api" "$API_TAGS" api
          publish "$PREFIX/mailbox-worker" "$WORKER_TAGS" worker
