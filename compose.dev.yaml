# Local development only: a Postgres reachable from this machine, with throwaway credentials.
name: mailbox-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: mailbox
      POSTGRES_PASSWORD: mailbox
      POSTGRES_DB: mailbox
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: [CMD, pg_isready, --username=mailbox, --dbname=mailbox]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
